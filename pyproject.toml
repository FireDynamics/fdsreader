[build-system]
requires = ["setuptools>=77", "wheel", "setuptools_scm[toml]"]
build-backend = "setuptools.build_meta"

[project]
name = "fdsreader"
dynamic = ["version"]
description = "Fast and easy-to-use Python reader for Fire Dynamics Simulator (FDS) output."
readme = "README.md"
requires-python = ">=3.11"
license = "LGPL-3.0-only"
license-files = ["LICENSE", "LICENSE.LESSER"]
authors = [
    {name = "Jan Vogelsang", email = "j.vogelsang@fz-juelich.de"},
    {name = "Marc Fehr", email = "m.fehr@fz-juelich.de"},
    {name = "Tristan Hehnen", email = "hehnen@uni-wuppertal.de"},
    {name = "Kristian Börger", email = "k.boerger@fz-juelich.de"},
    {name = "Lukas Arnold", email = "l.arnold@fz-juelich.de"},
]
maintainers = [
    {name = "Jan Vogelsang", email = "j.vogelsang@fz-juelich.de"},
    {name = "Marc Fehr", email = "m.fehr@fz-juelich.de"},
    {name = "Tristan Hehnen", email = "hehnen@uni-wuppertal.de"},
    {name = "Lukas Arnold", email = "l.arnold@fz-juelich.de"},
]
keywords = ["FDS", "Fire Dynamics Simulator", "fire", "fire safety", "CFD", "Smokeview", "simulation", "numpy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "typing_extensions",
]

[project.urls]
Documentation = "https://fdsreader.readthedocs.io"
Repository = "https://github.com/FireDynamics/fdsreader"
Issues = "https://github.com/FireDynamics/fdsreader/issues"
Changelog = "https://github.com/FireDynamics/fdsreader/releases"

[project.scripts]
fdsreader-explorer-cli = "fdsreader.explorer.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "coverage[toml]",
    "pre-commit",
]
docs = [
    "sphinx>=7.0",
    "furo",
    "autodocsumm",
    "sphinxcontrib-mermaid",
    "myst-nb",
]
notebook = [
    "matplotlib>=3.5",
    "ipywidgets>=8",
]
export = [
    "multiprocess",
    "pathos",
    "pyyaml",
]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.setuptools]
packages = [
    "fdsreader",
    "fdsreader.bndf",
    "fdsreader.devc",
    "fdsreader.evac",
    "fdsreader.explorer",
    "fdsreader.export",
    "fdsreader.fds_classes",
    "fdsreader.geom",
    "fdsreader.isof",
    "fdsreader.part",
    "fdsreader.pl3d",
    "fdsreader.slcf",
    "fdsreader.smoke3d",
    "fdsreader.utils",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["UP006", "UP007", "UP035"]  # typing generics – schrittweise migrieren

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
branch = true
source = ["fdsreader"]

[tool.coverage.report]
fail_under = 30
exclude_lines = [
    "if TYPE_CHECKING:",
    "pragma: no cover",
]
