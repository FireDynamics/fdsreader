# Monthly updates of the GitHub Actions in the workflows and of the pre-commit hooks, one PR each.
# The Python dependencies of fdsreader are left alone: as a library it does not pin them.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      pre-commit:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
